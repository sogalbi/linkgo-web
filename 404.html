<!DOCTYPE html>
<!--
  The SPA shell.

  With `web.output: 'single'` Expo renders one HTML file, and when this template
  exists it is used instead of the built-in one; the CSS links and the bundle
  <script> are injected at export time. A `src/app/+html.tsx` does NOT work
  here — in SPA mode Expo lifts only <meta> tags out of it and silently drops
  links, styles and scripts, which is exactly the manifest link and the service
  worker registration this app needs. That file belongs to `output: 'static'`.

  This is also the document the service worker caches as the offline shell, so
  anything required to boot a share offline has to be inline.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-JgWwDzfS+BxcWfesjbM6gh2LBlJyCO2otuJ5O1cBY9U='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.youtube.com https://publish.twitter.com; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      Only the origin, never the path, goes to other sites: /s/<token> and
      /join/<token> carry a secret in theirs. The Content-Security-Policy is
      added after this line at build time, with the hash of the one inline
      script below (scripts/build-web.mjs).
    -->
    <meta name="referrer" content="strict-origin" />

    <!--
      `viewport-fit=cover` puts the layout under the notch, which is what
      react-native-safe-area-context already compensates for. Zoom stays
      enabled: this is a reading app, and disabling pinch-zoom would be a real
      accessibility regression.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>LINKGO</title>
    <meta name="description" content="Save a link from any app and find it again." />

    <!--
      The manifest is what makes the app installable, and installability is what
      registers `share_target` — so this link is the difference between LINKGO
      being in the Android share sheet and not.
    -->
    <link rel="preconnect" href="https://mpkgaufdfcnyamoqswes.supabase.co" crossorigin />
    <link rel="manifest" href="/linkgo-web/manifest.json" />
    <meta name="theme-color" content="#0B0B0F" />

    <!--
      iOS ignores the manifest entirely. These are what an iPhone reads for
      "Add to Home Screen"; without them the shortcut opens in a Safari tab
      with a screenshot for an icon.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LINKGO" />
    <link rel="apple-touch-icon" href="/linkgo-web/icons/apple-touch-icon.png" />

    <!-- react-native-web's recommended reset, plus body scroll lock for <ScrollView>. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!--
      Painted before React mounts. Without it the browser shows its own white
      page for as long as the bundle takes to boot, which on a cold share is the
      first thing the user sees.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        background-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0b0b0f;
        }
      }

      /*
        The boot splash: LINKGO's name on the first frame the HTML can paint,
        held until the app knows whether there is a session — the moment the
        native splash hides (src/lib/boot-splash.web.ts removes it). Without
        it a first visit is an empty page for as long as the bundle downloads
        and the device account is made: 2 s on good LTE, 4 s on slow 4G.
      */
      #boot-splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: #ffffff;
        color: #111114;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Apple SD Gothic Neo',
          'Noto Sans KR', sans-serif;
        transition: opacity 160ms ease-out;
      }
      #boot-splash .boot-name {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      #boot-splash .boot-dots {
        display: flex;
        gap: 8px;
      }
      #boot-splash .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background-color: #ff5c38;
        animation: boot-pulse 1s ease-in-out infinite;
      }
      #boot-splash .boot-dots span:nth-child(2) {
        animation-delay: 150ms;
      }
      #boot-splash .boot-dots span:nth-child(3) {
        animation-delay: 300ms;
      }
      #boot-splash .boot-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @keyframes boot-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background-color: #0b0b0f;
          color: #f2f2f5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-dots span {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
    <!-- Without JavaScript nothing would ever remove it; the message below says why. -->
    <noscript>
      <style>
        #boot-splash {
          display: none;
        }
      </style>
    </noscript>
  <link rel="icon" href="/linkgo-web/favicon.ico"/>
<style>:root{--font-display:Spline Sans, Inter, ui-sans-serif, system-ui, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji;--font-mono:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;--font-rounded:"SF Pro Rounded", "Hiragino Maru Gothic ProN", Meiryo, "MS PGothic", sans-serif;--font-serif:Georgia, "Times New Roman", serif}</style></head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="boot-splash" role="status">
      <div class="boot-name">LINKGO</div>
      <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <span class="boot-label">불러오는 중</span>
    </div>
    <div id="root"></div>

    <!--
      Registered after `load` so it does not compete with the bundle it is
      caching. Failures are swallowed: no service worker means no offline shell
      and no install prompt, but the app itself is unaffected, and an unhandled
      rejection here would be the worse outcome.
    -->
    <script>
      // Never inside another site's frame: a page that frames LINKGO could lay
      // its own buttons over ours (clickjacking), and GitHub Pages cannot send
      // the header that forbids it. Hidden first, then broken out of.
      if (window.top !== window.self) {
        document.documentElement.style.display = 'none';
        try {
          window.top.location.replace(window.self.location.href);
        } catch (e) {}
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/linkgo-web/sw.js').catch(function () {});
        });
      }
    </script>
  <script src="/linkgo-web/_expo/static/js/web/entry-c34458fb6f2cee8713828c0169300efd.js" defer></script>
</body>
</html>
